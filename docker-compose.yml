services:
  postgres:
    image: postgres:17-alpine
    container_name: clipping-marketplace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clipping_marketplace
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clipping_marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
